# Set the actual unique app name during deployment.
app = "thrynt-engine"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  # flyctl resolves this path relative to the directory containing fly.toml;
  # the build context remains the monorepo root so workspace dependencies copy correctly.
  dockerfile = "../../apps/engine/Dockerfile"

[processes]
  worker = "node apps/engine/dist/index.js"

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["worker"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"
