name: THRYNT CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # GitHub-hosted Ubuntu images already include Playwright's Linux runtime
      # dependencies; installing only the pinned browser avoids an apt lock/
      # distro-migration hang while keeping the E2E browser deterministic.
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          THRYNT_E2E_BASE_URL: https://thrynt.vercel.app
          THRYNT_E2E_API_URL: https://thrynt.delealufejoel.workers.dev
